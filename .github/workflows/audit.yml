# Checks the gems in Gemfile.lock against published security advisories.
# Kept apart from deploy.yml so a new advisory shows up as a red check (and a
# GitHub email on the weekly run) without blocking deploys, which only wait on
# the `test` job there. To accept an advisory that doesn't apply, add its ID to
# config/bundler-audit.yml.
name: Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  bundler-audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Check gems for known advisories
        run: bin/bundler-audit
